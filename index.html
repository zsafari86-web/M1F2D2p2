  else if(mode=='sg'){q=`<p>خطی با جهت مثبت محور <bdi>x</bdi> زاویه‌ی ${dg(T)} می‌سازد. شیبش مثبت است، منفی یا صفر؟</p>`;o=bt('p','مثبت')+bt('n','منفی')+bt('z','صفر')}

  else{const[c,sn]=T,tn=r2(sn/c);const fr={'0.6,0.8':['۴','۳'],'0.8,0.6':['۳','۴'],'0.28,0.96':['۲۴','۷'],'0.96,0.28':['۷','۲۴']}[T.join()];q=`<p>نقطه‌ی <bdi>P</bdi> روی دایره‌ی یکه:</p>${EQ('cos α = '+nv(c)+' ، sin α = '+nv(sn))}<p>شیب خط <bdi>OP</bdi> یعنی <bdi dir=ltr>tan α</bdi> چند است؟</p>`;S.fr=fr;o=sh([['a',FR(fr[0],fr[1])],['b',FR(fr[1],fr[0])],['c',nv(sn)],['d',nv(c)]]).map(x=>bt(x[0],x[1])).join('')}
  put(`${q}${DOTS()}${o}<br><small>چهار جواب درست پشت‌سرهم لازم است.</small>`)}
 else put(FMSG()+DOTS()+(streak<4?`<button class=pri onclick="newQ12()">سوال بعدی</button>`:msg('good','آفرین! چهار جواب درست پشت‌سرهم! 🌸 واقعاً یاد گرفتی، همین‌طور ادامه بده 💪')+`<button class=pri onclick="home()">بازگشت به صفحه‌ی اصلی 🏠</button><button onclick="go(12)">تمرین دوباره</button>`))}
function ck12(v){let ok,t;
 if(mode=='ta'){ok=v==TA[T];t=(ok?'درست! ':'نه. ')+`شیب = <bdi dir=ltr>tan ${fa(T)}°</bdi> = <bdi dir=ltr>${TAH[TA[T]]}</bdi>`}
 else if(mode=='at'){ok=Number(v)==T;t=(ok?'درست! ':'نه. ')+`<bdi dir=ltr>tan ${fa(T)}°</bdi> = <bdi dir=ltr>${TAH[TA[T]]}</bdi>`}
 else if(mode=='sg'){const c=T==0?'z':T<90?'p':'n';ok=v==c;t=(ok?'درست! ':'نه. ')+'زاویه‌ی تند (کمتر از ۹۰°) شیب مثبت، زاویه‌ی باز (بیشتر از ۹۰°) شیب منفی و زاویه‌ی ۰° شیب صفر می‌دهد.'}
 else if(mode=='eq'){const m=T[0]==45?1:T[0]==135?-1:0;ok=v==eqs(m,T[1]);t=(ok?'درست! ':'نه. ')+`شیب = <bdi dir=ltr>tan ${fa(T[0])}° = ${nv(m)}</bdi>، پس <bdi dir=ltr>${eqs(m,T[1])}</bdi>`}
 else{ok=v=='a';t=(ok?'درست! ':'نه. ')+`<bdi dir=ltr>tan α = sin α ÷ cos α = ${nv(T[1])} ÷ ${nv(T[0])}</bdi>`}
 streak=ok?streak+1:0;if(streak==4)celebrate();fb=[ok,t+(ok?'':' (شمارش از اول، ولی تو می‌تونی! 💪)')];ph=5;render()}

function notes(i){stopC();$('chal').style.display='none';i=Math.max(0,Math.min(NPG.length-1,i));ni=i;view=2;$('home').style.display='none';document.querySelector('main').style.display='none';$('prog').style.display=$('steps').style.display='none';const mm=document.querySelector('.modal');if(mm&&mm.remove)mm.remove();
 const p=NPG[i]();$('notes').style.display='flex';$('notes').innerHTML=`<div class="card np"><div class=nv>${p.svg}</div><div><h2 class=nt>${p.t}</h2>${p.body}</div></div><div id=nnav><button onclick="notes(${i-1})" ${i?'':'disabled'}>▶ قبلی</button><span class=dt>${NPG.map((_,k)=>`<i class="${k==i?'on':''}" onclick="notes(${k})"></i>`).join('')}</span><button class=pri onclick="notes(${i+1})" ${i<NPG.length-1?'':'disabled'}>بعدی ◀</button></div>`;pb()}
$('notes').onpointerdown=e=>{nx0=e.clientX};$('notes').onpointerup=e=>{const d=e.clientX-nx0;if(Math.abs(d)>60)notes(ni+(d>0?1:-1))};

/* ---------- علامت درجه: همیشه سمت راست عدد ---------- */
const DEGRX=/([−-]?[۰-۹0-9]+(?:٫[۰-۹]+)?°)/;
function fixDeg(root){if(!root||!document.createTreeWalker)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];let n;while(n=w.nextNode()){if(n.textContent.indexOf('°')>-1&&!(n.parentElement&&n.parentElement.closest('svg,[dir=ltr]')))L.push(n)}
 for(const t of L){const parts=t.textContent.split(DEGRX);if(parts.length<2)continue;const f=document.createDocumentFragment();parts.forEach((q,i)=>{if(i%2){const b=document.createElement('bdi');b.setAttribute('dir','ltr');b.textContent=q;f.appendChild(b)}else if(q)f.appendChild(document.createTextNode(q))});t.parentNode.replaceChild(f,t)}}
function fixAll(){for(const id of ['panel','notes','chal','steps','prog','home']){const e=document.getElementById(id);if(e)fixDeg(e)}const m=document.querySelector('.modal');if(m)fixDeg(m)}
if(typeof MutationObserver!=='undefined'){const ob=new MutationObserver(()=>{ob.disconnect();fixAll();att()});const att=()=>{for(const id of ['panel','notes','chal','steps','prog','home'])ob.observe(document.getElementById(id),{childList:true,subtree:true});ob.observe(document.body,{childList:true})};att();window.__fixAll=fixAll}
$('sb').textContent=snd?'🔊':'🔇';
home();
if(window.__fixAll)window.__fixAll();
</script></body></html>
